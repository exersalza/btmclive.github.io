<!DOCTYPE html>

<html>
<head>
  <title>Chat Utils - BTMC</title>
  <script src="scripts/log.js"></script>
  <script src="scripts/nav.js"></script>
  <script src="scripts/load-nav.js"></script>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div id="dvd-body" style="position: fixed;z-index: -100;"></div>
  <div class="NavBar-wrap"></div>
  <div class="body" id="body">
    <h1>Chat Utils</h1>
    <h4>Under construction</h4>
    <div id="randomMsgBody">
      <div class="rmsgDiv">
        <h2>Here have a random ed message</h3>
          <div id="msgButtonsContainer">
            <button id="randomBtmcMsgButton" onclick="setRandomLog(true)">New Message</button>
          </div>
          <div class="gradientContainer gradient-border">
            <div class="fetchDisplay">
              <p id="randomBtmcLog">Loading...</p>
            </div>
          </div>
      </div>
      <div class="rmsgDiv">
        <h2>or a random chat message in general</h2>
        <div id="msgButtonsContainer">
          <button id="randomMsgButton" onclick="setRandomLog(false)">New Message</button>
        </div>
        <div class="gradientContainer gradient-border">
          <div class="fetchDisplay">
            <p id="randomLog">...</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
