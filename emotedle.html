<!DOCTYPE html>
<html>
<head>
    <title>Emotedle - BTMC</title>
    <link rel="stylesheet" href="style.css">
    <script src="scripts/nav.js"></script>
    <script src="scripts/load-nav.js"></script>
    <script src="scripts/emotedle.js"></script>
</head>

<body>
    <div class="NavBar-wrap"></div>
    <h1>Emotedle</h1>
    <div class="body">
        <div class="body-section" style="display: flex;flex-direction: column;gap: 1em;align-items: center;">
            <h2>Guess the emote</h2>
            <div id="emote-display" class="gradientContainer gradient-border">
                <div class="fetchDisplay">
                    <div id="emote-image-container"></div>
                </div>
            </div>
            <form id="input-form" action="">
                <input id="guess-input" required autofocus minlength="1" maxlength="30" type="string">
            </form>
            <div id="button-container">
                <button id="submit-button">Submit</button>
            </div>
            <div id="guess-result">
                Attempt: 0/5
            </div>
            <div id="guess-history">
                <table id="guess-table">
                    <tr>
                        <th>Attempt</th>
                        <th>Guess</th>
                    </tr>
                </table>
            </div>
        </div>
        <div class="body-section">
            <h2>How To Play</h2>
            <p>Use the given area of the emote to guess the name of the 7tv emote from Ed's chat and globals. Area increases per attempt.</p>
            <sub>If the display is blank after ~5 seconds, then the emote is just transparent</sub>
        </div>
    </div>
</body>

</html>
